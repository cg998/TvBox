name: 每日源健康检查

on:
  schedule:
    - cron: '26 22 * * *'   # 每天北京时间 06:26(父母起床看电视前; 刻意避开整点/半点, GitHub schedule 在整点高负载时段延迟最大)
    - cron: '22 10 * * *'   # 每天北京时间 18:22(傍晚黄金时段前补检一次; 同样避开整点)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pycryptodome cos-python-sdk-v5

      - name: 运行健康检查
        run: python health_check.py config.json

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "无变化,跳过提交" || (git commit -m "health: 每日体检 $(date -u +%Y-%m-%d)" && git push)

      - name: 刷新 jsdelivr 缓存
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist/my_interface.json" || true

      - name: 部署到腾讯云 COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_ENDPOINT: cos.accelerate.myqcloud.com
        run: python deploy_cos.py config.json
